<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>VisualStudio Pro 4K Live Testing Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #09090b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #sandbox-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    #shader-overlay-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.3s ease;
    }

    canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    /* 屏蔽無關的 DOM 輸入與提示 */
    input, button, select, textarea, label, form, fieldset, nav,
    .dg, .lil-gui, .qs_main, .opc-control, #opc-control-panel, .control-panel,
    [class*="gui"], [id*="gui"], [class*="instruction"], [id*="instruction"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>

  <!-- 本地核心相依庫 -->
  <script src="../custom_visuals/libs/p5.min.js"></script>
  <script src="../custom_visuals/libs/p5.sound.min.js"></script>
  <script src="../custom_visuals/libs/chroma.min.js"></script>
  <script src="../custom_visuals/libs/gsap.min.js"></script>

  <!-- 雙緩衝沙盒與聲學適配代理 -->
  <script src="audio_bridge.js"></script>
  <script src="double_buffer_sandbox.js"></script>
</head>
<body>
  <div id="sandbox-viewport">
    <div id="shader-overlay-container">
      <!-- p5.js canvas will be mounted here -->
    </div>
  </div>

  <!-- 動態用戶代碼容器 -->
  <script id="user-code-injection">
    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      colorMode(RGB, 255);
    }
    function draw() {
      background(10, 10, 15);
      orbitControl(1, 1, 0.1);
      rotateX(frameCount * 0.01);
      rotateY(frameCount * 0.01);
      let pulse = 1.0 + (window.sub_bass || 0.5) * 0.5;
      scale(pulse);
      stroke(168, 85, 247);
      noFill();
      box(180);
    }
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
